<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f9ff">
  <meta name="description" content="离线学习记录">
  <title>泡泡笔记</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%237a91e8'/%3E%3Ccircle cx='25' cy='27' r='12' fill='white'/%3E%3Ccircle cx='42' cy='39' r='9' fill='%23dfe9ff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
  <script src="./pdf.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="top"><div class="brand"><span class="mark" aria-hidden="true"></span>泡泡笔记</div><div class="top-actions"><span id="save-status" class="save-status" role="status">加载中…</span><button id="open-backup" class="backup-button">备份</button></div></header>
    <section id="home" class="view active" aria-label="分区">
      <div class="page-head"><h1>分区</h1><button id="add-section" class="primary add-button" aria-label="新建分区" title="新建分区">＋</button></div>
      <div id="sections" class="sections"></div>
    </section>
    <section id="zone" class="view" aria-label="记录">
      <button class="back" id="back-home">← 分区</button>
      <div class="page-head"><div class="title-tools"><h1 id="zone-title"></h1><button id="edit-section" class="icon-button" aria-label="编辑分区">···</button></div><button id="add-record" class="primary add-button" aria-label="新建记录" title="新建记录">＋</button></div>
      <div id="records" class="record-grid"></div>
    </section>
    <section id="record" class="view" aria-label="记录内容">
      <button class="back" id="back-zone">← <span id="record-zone-name">记录</span></button>
      <div class="record-sheet">
        <input id="record-title" class="record-title" type="text" maxlength="80" placeholder="记录标题" aria-label="记录标题">
        <textarea id="record-body" class="record-body" rows="2" placeholder="直接开始记录…" aria-label="记录内容"></textarea>
        <div class="level-row"><span class="field-label">标记</span><div id="record-levels" class="level-picks"></div></div>
        <div class="tip-head"><h2>小 tip <span id="tip-count"></span></h2><div class="tip-actions"><button id="export-record-pdf" class="secondary small-icon" aria-label="导出记录 PDF" title="导出记录 PDF">PDF</button><button id="add-tip" class="secondary small-icon" aria-label="新建 tip" title="新建 tip">＋</button></div></div>
        <div id="tips" class="tips"></div>
        <details class="attachment-dock" aria-label="记录附件">
          <summary class="attachment-head"><span>附件 <span id="attachment-count"></span></span><span class="attachment-chevron" aria-hidden="true">⌄</span></summary>
          <div class="attachment-actions"><button id="add-image" class="secondary small-icon" aria-label="添加图片" title="添加图片">▧</button><button id="add-file" class="secondary small-icon" aria-label="添加文件" title="添加文件">▤</button><button id="add-drawing" class="secondary small-icon" aria-label="手写" title="手写">✎</button></div>
          <input id="image-file" type="file" accept="image/*" multiple hidden>
          <input id="other-file" type="file" multiple hidden>
          <div id="attachments" class="attachments"></div>
        </details>
      </div>
      <button id="delete-record" class="text-danger">删除记录</button>
    </section>
  </main>
  <div id="drag-trash" class="drag-trash" role="status" hidden><span aria-hidden="true">🗑</span> 松开放入删除</div>
  <div id="undo-toast" class="undo-toast" role="status" hidden><span id="undo-label">已删除</span><button id="undo-delete" aria-label="撤销删除">撤销</button></div>
  <div id="section-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="section-dialog-title" hidden>
    <div class="dialog"><h2 id="section-dialog-title">新建分区</h2><label for="section-name">名称</label><input id="section-name" maxlength="24" placeholder="例如：数学"><label>颜色</label><div id="section-colors" class="swatches"></div><label>形状</label><div id="section-shapes" class="shape-picks"></div><div class="dialog-actions"><button id="delete-section" class="text-danger" hidden>删除分区</button><span class="spacer"></span><button id="cancel-section" class="secondary">取消</button><button id="save-section" class="primary">完成</button></div></div>
  </div>
  <div id="tip-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="tip-dialog-title" hidden>
    <div class="dialog tip-dialog"><div class="tip-topbar"><div class="tip-color-wrap"><button id="tip-color-button" class="tip-top-button" aria-label="重要程度" aria-expanded="false" title="重要程度"><span class="tip-current-color"></span></button><div id="tip-color-popover" class="tip-color-popover" hidden><div id="tip-levels" class="level-picks"></div></div></div><div class="tip-insert" role="toolbar" aria-label="插入内容"><button id="tip-add-text" class="tip-top-button" aria-label="插入文字" title="文字">▤</button><button id="tip-add-image" class="tip-top-button" aria-label="插入图片" title="图片">▧</button><button id="tip-add-drawing" class="tip-top-button" aria-label="插入手写" title="手写">✎</button><button id="tip-add-file" class="tip-top-button" aria-label="插入文件" title="文件">📎</button><input id="tip-image-file" type="file" accept="image/*" multiple hidden><input id="tip-other-file" type="file" multiple hidden></div><button id="cancel-tip" class="tip-top-button tip-close" aria-label="关闭" title="关闭">×</button></div><h2 id="tip-dialog-title" class="tip-dialog-title">小 tip</h2><input id="tip-title" maxlength="80" placeholder="标题" aria-label="tip 标题"><div id="tip-document" class="tip-document" aria-label="tip 内容"></div><div class="dialog-actions spread"><button id="delete-tip" class="text-danger" hidden>删除 tip</button><button id="export-tip-pdf" class="secondary" aria-label="导出这个 tip 为 PDF">PDF</button><span class="spacer"></span><button id="save-tip" class="primary">完成</button></div></div>
  </div>
  <div id="backup-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="backup-dialog-title" hidden>
    <div class="dialog"><h2 id="backup-dialog-title">数据备份</h2><p class="backup-note">备份保存在你选择的位置。导入会添加到现有数据。</p><button id="export-backup" class="backup-option">↓ 导出备份</button><button id="choose-backup" class="backup-option">↑ 导入备份</button><input id="backup-file" type="file" accept=".json,application/json" hidden><p id="import-summary" class="import-summary" hidden></p><div class="dialog-actions"><button id="cancel-backup" class="secondary">关闭</button><button id="confirm-import" class="primary" hidden>确认导入</button></div></div>
  </div>
  <div id="drawing-modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="drawing-dialog-title" hidden>
    <div class="dialog drawing-dialog"><h2 id="drawing-dialog-title">手写</h2><canvas id="drawing-canvas" aria-label="手写区域"></canvas><div class="drawing-tools"><button id="drawing-undo" class="secondary" aria-label="撤销上一笔">↶</button><button id="drawing-clear" class="secondary" aria-label="清空手写">清空</button><span class="spacer"></span><button id="drawing-cancel" class="secondary">取消</button><button id="drawing-save" class="primary">完成</button></div></div>
  </div>
  <div id="message" class="message" role="alert" hidden></div>
  <div id="reveal" class="reveal" role="status" hidden><strong id="reveal-title"></strong><p id="reveal-body"></p><small>再点一次打开</small></div>
</body>
</html>
