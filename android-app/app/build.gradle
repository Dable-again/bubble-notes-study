plugins { id 'com.android.application' }

def signingProperties = new Properties()
def signingFile = rootProject.file('signing.properties')
if (signingFile.exists()) signingFile.withInputStream { signingProperties.load(it) }

android {
    namespace 'com.bubblenotes.study'
    compileSdk 35

    defaultConfig {
        applicationId 'com.bubblenotes.study'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            if (signingFile.exists()) {
                storeFile rootProject.file(signingProperties['storeFile'])
                storePassword signingProperties['storePassword']
                keyAlias signingProperties['keyAlias']
                keyPassword signingProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (signingFile.exists()) signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}

tasks.register('syncWebAssets', Copy) {
    from('../../dist')
    into('src/main/assets/site')
    exclude('.openai/**')
    exclude('**/*.apk')
}
preBuild.dependsOn(tasks.named('syncWebAssets'))
